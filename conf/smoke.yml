# Smoke-test plan: a narrow window and the ONNX backend, so an end-to-end run
# finishes in minutes against the live APIs. Used by `make smoke` and by the
# integration test. Not the published configuration -- see prodrome.yml.
include:
  - cohort.yml
  - negative_controls.yml

window:
  first_quarter: "2021Q1"
  last_quarter: "2024Q4"

http:
  # openFDA documents 240 requests/minute, but its SUSTAINED capacity is lower.
  # Measured on a cold backfill: 200/minute drew HTTP 500s that cost three drugs from
  # the run, while the identical queries issued at 60/minute succeeded 30/30. The
  # documented ceiling behaves like a burst limit, not a throughput figure.
  #
  # 90/minute sits comfortably below where degradation began. The circuit breaker
  # throttles further if the upstream still sheds load. A backfill is bounded by
  # request count rather than compute, so this is the single setting that most affects
  # how long a cold run takes -- raise it only with evidence.
  requests_per_minute: 90
  timeout_seconds: 60.0
  # Five attempts with jittered exponential backoff.
  #
  # This setting has a history worth knowing before changing it. It was briefly nine,
  # on the belief that openFDA's event index failed ~40% of the time at random. That
  # belief was wrong, and wrong twice over. Most of those failures were one malformed
  # query of ours -- counting an analysed string field, which openFDA answers with
  # HTTP 500 rather than 400 (see openfda.validate_count_field). The rest were
  # load-induced, and the fix for those is a lower request rate, not more attempts.
  #
  # Neither cause is helped by a bigger retry budget, and a bigger budget made both
  # harder to see. Five attempts is for genuine transient faults.
  max_retries: 5
  backoff_base_seconds: 1.5
  max_sleep_seconds: 30.0

max_reactions_per_drug: 12
min_reaction_reports: 10

labelmatch:
  embed_backend: onnx
  onnx_model: BAAI/bge-small-en-v1.5
  similarity_threshold: 0.62
  chunk_sentences: 3
  chunk_stride: 2
  top_k: 5

latency:
  horizon_quarters: 8
  holdout_from_quarter: "2023Q3"
  min_case_count: 3
