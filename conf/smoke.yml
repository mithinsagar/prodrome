# Smoke-test plan: a narrow window and the ONNX backend, so an end-to-end run
# finishes in minutes against the live APIs. Used by `make smoke` and by the
# integration test. Not the published configuration -- see prodrome.yml.
include:
  - cohort.yml
  - negative_controls.yml

window:
  first_quarter: "2021Q1"
  last_quarter: "2024Q4"

http:
  requests_per_minute: 120
  timeout_seconds: 60.0
  # openFDA's drug/event index was observed returning intermittent 500s on
  # roughly 40% of requests while its other indexes stayed healthy. Nine
  # attempts with jittered exponential backoff bring the per-request loss
  # probability under 0.1%; responses are cached, so a re-run costs only what
  # still has not succeeded.
  # Five attempts with jittered exponential backoff. Measured against the live API,
  # every query shape this pipeline sends succeeds 45/45, so retries exist for
  # genuine transient faults rather than for a chronically unhealthy upstream.
  #
  # An earlier version of this file set nine attempts, on the belief that openFDA's
  # event index failed ~40% of the time. That was wrong: the failures were entirely
  # one malformed query of ours -- counting an analysed string field, which openFDA
  # answers with HTTP 500 rather than 400. Retrying a deterministic client error is
  # pure waste, so the fix was a pre-flight guard (see openfda.validate_count_field),
  # not a bigger retry budget.
  max_retries: 5
  backoff_base_seconds: 1.5
  max_sleep_seconds: 30.0

max_reactions_per_drug: 12
min_reaction_reports: 10

labelmatch:
  embed_backend: onnx
  onnx_model: BAAI/bge-small-en-v1.5
  similarity_threshold: 0.62
  chunk_sentences: 3
  chunk_stride: 2
  top_k: 5

latency:
  horizon_quarters: 8
  holdout_from_quarter: "2023Q3"
  min_case_count: 3
